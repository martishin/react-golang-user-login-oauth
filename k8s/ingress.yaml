apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth
  namespace: react-golang-user-login-oauth
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - oauth.martishin.com
      secretName: oauth-tls
  rules:
    - host: oauth.martishin.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: user-login-api
                port:
                  number: 80
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: user-login-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-login-client
                port:
                  number: 80
