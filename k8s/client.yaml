apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-login-client
  namespace: react-golang-user-login-oauth
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: user-login-client
  template:
    metadata:
      labels:
        app: user-login-client
    spec:
      containers:
        - name: client
          image: ghcr.io/martishin/react-golang-user-login-oauth-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: user-login-client
  namespace: react-golang-user-login-oauth
spec:
  selector:
    app: user-login-client
  ports:
    - name: http
      port: 80
      targetPort: 80
